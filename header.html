<style>
  #site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    background: #06100c;
  }

  #site-header .bs-header {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.25rem;
    width: 100%;
    min-height: 72px;
    padding: 0.82rem 1.25rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(6, 16, 12, 0.94);
    color: #ffffff;
    font-family: "Manrope", Arial, sans-serif;
    letter-spacing: 0;
    backdrop-filter: blur(18px);
  }

  #site-header .bs-brand {
    display: inline-flex;
    align-items: center;
    gap: 0.72rem;
    flex: 0 0 auto;
    color: #ffffff;
    text-decoration: none;
  }

  #site-header .bs-brand-logo {
    display: inline-grid;
    width: 2.35rem;
    height: 2.35rem;
    place-items: center;
    border-radius: 8px;
    background: #ffffff;
  }

  #site-header .bs-brand img {
    display: block;
    width: 1.72rem;
    height: 1.72rem;
    object-fit: contain;
  }

  #site-header .bs-brand-text {
    display: grid;
    gap: 0.1rem;
    line-height: 1;
  }

  #site-header .bs-brand-name {
    font-size: 0.92rem;
    font-weight: 850;
  }

  #site-header .bs-brand-meta {
    color: rgba(255, 255, 255, 0.54);
    font-size: 0.72rem;
    font-weight: 700;
  }

  #site-header .bs-menu-toggle {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
    padding: 0;
    white-space: nowrap;
  }

  #site-header .bs-menu-button {
    display: none;
    width: 2.35rem;
    height: 2.35rem;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.3rem;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: #ffffff;
    cursor: pointer;
  }

  #site-header .bs-menu-button span {
    display: block;
    width: 1.12rem;
    height: 2px;
    border-radius: 999px;
    background: currentColor;
  }

  #site-header .bs-nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1.15rem;
    min-width: 0;
    color: rgba(255, 255, 255, 0.68);
    font-size: 0.84rem;
    font-weight: 760;
    line-height: 1;
    white-space: nowrap;
  }

  #site-header .bs-nav a {
    color: inherit;
    text-decoration: none;
    transition: color 160ms ease, background 160ms ease, border-color 160ms ease;
  }

  #site-header .bs-nav a:hover,
  #site-header .bs-nav a[aria-current="true"] {
    color: #ffffff;
  }

  #site-header .bs-nav-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 2.35rem;
    padding: 0 0.95rem;
    border-radius: 999px;
    background: #00c676;
    color: #00170d !important;
    font-weight: 850;
  }

  #site-header .bs-nav-cta:hover {
    background: #00ff9c;
  }

  #site-header .language-picker {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    min-height: 2.35rem;
    padding: 0.18rem 0.18rem 0.18rem 0.68rem;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.62);
    font-size: 0.72rem;
    font-weight: 850;
    line-height: 1;
  }

  #site-header .language-picker select {
    width: 3.15rem;
    min-height: 1.9rem;
    border: 0;
    border-radius: 999px;
    background: #ffffff;
    color: #06100c;
    font: inherit;
    font-weight: 850;
    text-align: center;
    cursor: pointer;
  }

  @media (max-width: 1120px) {
    #site-header .bs-header {
      gap: 0.85rem;
      padding-right: 0.85rem;
      padding-left: 0.85rem;
    }

    #site-header .bs-nav {
      gap: 0.82rem;
      font-size: 0.78rem;
    }

    #site-header .bs-brand-meta,
    #site-header .language-picker span {
      display: none;
    }

    #site-header .bs-nav-cta {
      padding: 0 0.8rem;
    }
  }

  @media (max-width: 900px) {
    #site-header .bs-header {
      display: grid;
      grid-template-columns: 2.5rem 1fr auto;
      gap: 0.7rem;
      padding: 0.72rem 0.88rem;
    }

    #site-header .bs-menu-button {
      display: inline-flex;
      grid-column: 1;
      grid-row: 1;
    }

    #site-header .bs-brand {
      grid-column: 2;
      justify-self: center;
    }

    #site-header .bs-brand-meta,
    #site-header .language-picker span {
      display: none;
    }

    #site-header .language-picker {
      grid-column: 3;
      width: auto;
      padding-left: 0.18rem;
    }

    #site-header .bs-nav {
      position: absolute;
      left: 0.88rem;
      right: 0.88rem;
      top: calc(100% + 0.55rem);
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0.25rem;
      padding: 0.72rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: #06100c;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.98rem;
      line-height: 1.2;
      white-space: normal;
    }

    #site-header .bs-nav a {
      padding: 0.82rem 0.78rem;
      border-radius: 8px;
    }

    #site-header .bs-nav a:hover,
    #site-header .bs-nav a[aria-current="true"] {
      background: rgba(255, 255, 255, 0.06);
    }

    #site-header .bs-nav-cta {
      min-height: 2.75rem;
      margin-top: 0.25rem;
    }

    #site-header .bs-menu-toggle:checked ~ .bs-nav {
      display: flex;
    }
  }

  @media (max-width: 430px) {
    #site-header .bs-brand-name {
      font-size: 0.8rem;
    }
  }

  @media print {
    #site-header {
      position: static;
    }

    #site-header .bs-header {
      position: static;
    }
  }
</style>
