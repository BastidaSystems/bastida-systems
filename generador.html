          '.btn{display:inline-block;background:#fff;color:' + dark + ';font-weight:800;text-decoration:none;padding:14px 30px;border-radius:999px}' +
          '.btn2{display:inline-block;background:' + c + ';color:#fff;font-weight:700;text-decoration:none;padding:13px 28px;border-radius:999px}' +
          '.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;color:#fff;font-weight:800;font-size:19px}' +
          '.top a{color:#fff;text-decoration:none;font-size:14px;font-weight:700;border:2px solid rgba(255,255,255,.7);padding:8px 18px;border-radius:999px}' +
          '.cards{margin-top:-46px;position:relative;z-index:2}' +
          'section{padding:50px 0}h2{font-size:26px;margin-bottom:20px}' +
          '.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}' +
          '.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 12px 32px rgba(0,0,0,.09);border-top:5px solid ' + c + '}' +
          '.contact{background:#23211d;color:#f5efe6;border-radius:24px;margin:0 12px 12px}' +
          '.contact a{color:' + c + ';font-weight:700;text-decoration:none}' +
          '.contact p{margin:8px 0;opacity:.85}' +
          'footer{padding:24px 0 34px;text-align:center;color:#9a938a;font-size:13px}' +
          '@media(max-width:600px){.hero{padding:50px 0 80px}}</style></head><body>' +
          '<div class="hero"><div class="wrap"><div class="top"><span>' + esc(d.name) + '</span>' +
          '<a href="' + d.waLink + '">WhatsApp</a></div>' +
          '<h1>' + esc(d.name) + '</h1>' +
          (d.tagline ? '<p class="tag">' + esc(d.tagline) + '</p>' : '') +
          (d.desc ? '<p>' + esc(d.desc) + '</p>' : '') +
          '<a class="btn" href="' + d.waLink + '">' + esc(t('gen.contactCta')) + '</a></div></div>' +
          (svc ? '<section><div class="wrap cards"><h2>' + esc(t('gen.servicesTitle')) + '</h2><div class="grid">' + svc + '</div></div></section>' : '') +
          '<section><div class="contact"><div class="wrap" style="padding-top:44px;padding-bottom:44px"><h2>' + esc(t('gen.contactTitle')) + '</h2>' +
          '<p><a href="' + d.waLink + '">WhatsApp</a></p>' +
          (d.email ? '<p>' + esc(d.email) + '</p>' : '') +
          (d.address ? '<p>' + esc(d.address) + '</p>' : '') +
          '<p style="margin-top:18px"><a class="btn2" href="' + d.waLink + '">' + esc(t('gen.contactCta')) + '</a></p>' +
          '</div></div></section>' +
          '<footer>' + esc(t('gen.credit')) + '</footer></body></html>';
        }
      };

      var MOCKS = {
        moderno: '<div style="height:100%;background:#0d0d10;padding:16px"><div style="height:10px;width:40%;background:#00c676;border-radius:5px;margin-bottom:12px"></div><div style="height:16px;width:85%;background:#2a2a30;border-radius:6px;margin-bottom:8px"></div><div style="height:16px;width:65%;background:#2a2a30;border-radius:6px;margin-bottom:14px"></div><div style="height:26px;width:45%;background:#00c676;border-radius:13px"></div></div>',
        claro: '<div style="height:100%;background:#f7f9fa;padding:16px"><div style="height:10px;width:40%;background:#c9d2d9;border-radius:5px;margin-bottom:12px"></div><div style="height:16px;width:85%;background:#e3e8ec;border-radius:6px;margin-bottom:8px"></div><div style="height:16px;width:65%;background:#e3e8ec;border-radius:6px;margin-bottom:14px"></div><div style="height:26px;width:45%;background:#00c676;border-radius:13px"></div></div>',
        vibrante: '<div style="height:100%;background:linear-gradient(135deg,#00c676,#047857);padding:16px"><div style="height:10px;width:40%;background:rgba(255,255,255,.85);border-radius:5px;margin-bottom:12px"></div><div style="height:16px;width:85%;background:rgba(255,255,255,.5);border-radius:6px;margin-bottom:8px"></div><div style="height:16px;width:65%;background:rgba(255,255,255,.5);border-radius:6px;margin-bottom:14px"></div><div style="height:26px;width:45%;background:#fff;border-radius:13px"></div></div>'
      };

      function buildDoc() {
        var d = docData();
        var fn = TEMPLATES[state.design] || TEMPLATES.moderno;
        return fn(d, lang());
      }

      /* ---------------- Steps UI ---------------- */
      function renderSteps() {
        var labels = [t('gen.step1'), t('gen.step2'), t('gen.step3')];
        stepsEl.innerHTML = labels.map(function (label, i) {
          var n = i + 1;
          var cls = 'gen-step' + (n === state.step ? ' gen-step--active' : n < state.step ? ' gen-step--done' : '');
          return '<span class="' + cls + '"><span class="gen-step__num">' + n + '</span>' + esc(label) + '</span>';
        }).join('');
      }

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = msg ? 'block' : 'none';
        if (msg) errorEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function field(id, labelKey, hintKey, required, multiline, inputType) {
        var req = required ? ' <span class="req">*</span>' : '';
        var hint = hintKey ? '<span class="hint">' + esc(t(hintKey)) + '</span>' : '';
        var val = esc(state[id.replace('g_', '')] || '');
        var input = multiline
          ? '<textarea id="' + id + '" rows="4">' + val + '</textarea>'
          : '<input id="' + id + '" type="' + (inputType || 'text') + '" value="' + val + '">';
        return '<label>' + esc(t(labelKey)) + req + hint + input + '</label>';
      }

      function renderForm() {
        var sw = COLORS.map(function (c) {
          var sel = state.color === c ? ' gen-swatch--selected' : '';
          return '<button type="button" class="gen-swatch' + sel + '" data-color="' + c +
            '" style="background:' + c + '" aria-label="' + c + '"></button>';
        }).join('');
        body.innerHTML =
          '<div class="gen-form">' +
          field('g_name', 'gen.f_name', null, true) +
          field('g_tagline', 'gen.f_tagline', 'gen.f_taglineHint', false) +
          field('g_desc', 'gen.f_desc', 'gen.f_descHint', false, true) +
          field('g_services', 'gen.f_services', 'gen.f_servicesHint', false, true) +
          field('g_whatsapp', 'gen.f_whatsapp', 'gen.f_whatsappHint', true, false, 'tel') +
          field('g_email', 'gen.f_email', null, false, false, 'email') +
          field('g_address', 'gen.f_address', null, false) +
          '<label>' + esc(t('gen.f_color')) + '<span class="gen-swatches">' + sw + '</span></label>' +
          '</div>';
        nav.innerHTML = '<button class="gen-btn" id="gen-next">' + esc(t('gen.next')) + '</button>';
        body.querySelectorAll('.gen-swatch').forEach(function (b) {
          b.addEventListener('click', function () {
            state.color = b.getAttribute('data-color');
            body.querySelectorAll('.gen-swatch').forEach(function (x) { x.classList.remove('gen-swatch--selected'); });
            b.classList.add('gen-swatch--selected');
          });
        });
        document.getElementById('gen-next').addEventListener('click', function () {
          collect();
          if (!state.name.trim() || state.whatsapp.replace(/\D/g, '').length < 7) {
            showError(t('gen.required')); return;
          }
          showError('');
          state.step = 2; render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      function collect() {
        ['name', 'tagline', 'desc', 'services', 'whatsapp', 'email', 'address'].forEach(function (k) {
          var el = document.getElementById('g_' + k);
          if (el) state[k] = el.value;
        });
      }

      function renderDesigns() {
        var defs = [
          { id: 'moderno', name: t('gen.t1name'), desc: t('gen.t1desc') },
          { id: 'claro', name: t('gen.t2name'), desc: t('gen.t2desc') },
          { id: 'vibrante', name: t('gen.t3name'), desc: t('gen.t3desc') }
        ];
        body.innerHTML =
          '<h2 class="gen-title">' + esc(t('gen.designTitle')) + '</h2>' +
          '<p class="gen-sub">' + esc(t('gen.designSub')) + '</p>' +
          '<div class="gen-designs">' + defs.map(function (d) {
            var sel = state.design === d.id ? ' gen-design--selected' : '';
            return '<button type="button" class="gen-design' + sel + '" data-design="' + d.id + '">' +
              '<span class="gen-design__mock">' + MOCKS[d.id] + '</span>' +
              '<span class="gen-design__body"><h3>' + esc(d.name) + '</h3><p>' + esc(d.desc) + '</p></span></button>';
          }).join('') + '</div>';
        nav.innerHTML =
          '<button class="gen-btn gen-btn--ghost" id="gen-back">' + esc(t('gen.back')) + '</button>' +
          '<button class="gen-btn" id="gen-next">' + esc(t('gen.next')) + '</button>';
        body.querySelectorAll('.gen-design').forEach(function (b) {
          b.addEventListener('click', function () {
            state.design = b.getAttribute('data-design');
            body.querySelectorAll('.gen-design').forEach(function (x) { x.classList.remove('gen-design--selected'); });
            b.classList.add('gen-design--selected');
            showError('');
          });
        });
        document.getElementById('gen-back').addEventListener('click', function () { state.step = 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        document.getElementById('gen-next').addEventListener('click', function () {
          if (!state.design) { showError(t('gen.designTitle')); return; }
          showError('');
          state.step = 3; render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      function payHref() {
        if (STRIPE_PAYMENT_LINK) return STRIPE_PAYMENT_LINK;
        var msg = encodeURIComponent(lang() === 'es'
          ? 'Hola, quiero pagar mi Página Express ($25 USD).'
          : 'Hello, I want to pay for my Express Page ($25 USD).');
        return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + msg;
      }

      function renderResult() {
        var doc = buildDoc();
        body.innerHTML =
          '<h2 class="gen-title">' + esc(t('gen.previewTitle')) + '</h2>' +
          '<p class="gen-sub">' + esc(t('gen.previewSub')) + '</p>' +
          '<div class="gen-preview-wrap"><div class="gen-preview-bar">' +
          '<span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
          '<span class="url">' + esc(slug(state.name)) + '.html</span></div>' +
          '<iframe id="gen-preview" title="preview" sandbox="allow-same-origin"></iframe></div>' +
          '<div class="gen-paybox"><h2 style="margin:0">' + esc(t('gen.payTitle')) + '</h2>' +
          '<div class="gen-paybox__price">$25 USD</div>' +
          '<p class="gen-paybox__note">' + esc(t('gen.payNote')) + '</p>' +
          '<p><a class="gen-btn" id="gen-pay" href="' + esc(payHref()) + '" target="_blank" rel="noopener">' + esc(t('gen.payBtn')) + '</a></p>' +
          '<p style="margin:18px 0 0"><button class="gen-btn gen-btn--ghost" id="gen-download">' + esc(t('gen.downloadBtn')) + '</button></p></div>';
        var frame = document.getElementById('gen-preview');
        // srcdoc via JS to avoid quoting issues
        frame.srcdoc = doc;
        nav.innerHTML =
          '<button class="gen-btn gen-btn--ghost" id="gen-back">' + esc(t('gen.back')) + '</button>';
        document.getElementById('gen-back').addEventListener('click', function () { state.step = 2; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        document.getElementById('gen-download').addEventListener('click', function () {
          var blob = new Blob([buildDoc()], { type: 'text/html' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = slug(state.name) + '.html';
          document.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
        });
      }

      function render() {
        showError('');
        renderSteps();
        if (state.step === 1) renderForm();
        else if (state.step === 2) renderDesigns();
        else renderResult();
      }

      document.addEventListener('change', function (e) {
        if (e.target && e.target.id === 'language-select') setTimeout(render, 0);
      });

      render();
    })();
  </script>
  <script src="agency.js?v=2026-08-25-store" defer></script>
  <script src="whatsapp-float.js?v=2026-09-23-wa" defer></script>
</body>
</html>
