<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Amazon LineOps | Admin Bastida Systems</title>
  <link rel="icon" type="image/png" href="../img/logo_bastida_sys.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0f0e; --card:#121815; --line:#1f2a24; --txt:#eef4f0; --mut:#9fb3a8; --acc:#00c676; --danger:#e5484d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--txt); font-family:Montserrat,system-ui,sans-serif; }
    .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 64px; }
    header.top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; }
    header.top h1 { font-size:1.4rem; margin:0; }
    header.top p { color:var(--mut); margin:4px 0 0; font-size:.85rem; }
    .btn { display:inline-block; background:var(--acc); color:#04120b; border:0; border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn.ghost { background:transparent; color:var(--txt); border:1px solid var(--line); }
    .btn.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
    .btn.small { padding:6px 12px; font-size:.8rem; border-radius:8px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px; }
    .card h2 { margin:0 0 16px; font-size:1.05rem; }
    label { display:block; font-size:.8rem; color:var(--mut); margin:12px 0 6px; }
    input, textarea { width:100%; background:#0b0f0e; border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:.95rem; }
    .status { min-height:1.4em; font-size:.9rem; margin:8px 0; }
    .status.ok { color:var(--acc); } .status.err { color:var(--danger); }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { color:var(--mut); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; }
    .thumb { width:56px; height:56px; object-fit:cover; border-radius:8px; background:#000; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:.75rem; font-weight:700; }
    .pill.on { background:rgba(0,198,118,.15); color:var(--acc); }
    .pill.off { background:rgba(229,72,77,.12); color:var(--danger); }
    .actions { display:flex; gap:6px; flex-wrap:wrap; }
    .hidden { display:none !important; }
    .login-note { color:var(--mut); }
    a { color:var(--acc); }
    .preview-img { max-width:180px; border-radius:10px; margin-top:8px; display:block; }
    .mono { font-family:ui-monospace,monospace; font-size:.8rem; word-break:break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Amazon LineOps</h1>
        <p>Solo nombre, descripción, foto y link de afiliado. Solo aparecen en el Market de la app LineOps.</p>
      </div>
      <div class="actions">
        <a class="btn ghost small" href="productos.html">Bastida Stock</a>
        <button class="btn ghost small" id="logout-btn" type="button">Salir</button>
      </div>
    </header>

    <div id="gate" class="card">
      <p class="login-note" id="gate-msg">Verificando sesión…</p>
    </div>

    <div id="app" class="hidden">
      <div class="card">
        <h2 id="form-title">Agregar producto a LineOps</h2>
        <form id="product-form" novalidate>
          <input type="hidden" id="f-id">
          <label for="f-name">Nombre *</label>
          <input id="f-name" required maxlength="80" placeholder="Termómetro digital para cocina">
          <label for="f-desc">Descripción</label>
          <textarea id="f-desc" maxlength="300" placeholder="Para qué sirve, qué incluye…" rows="2"></textarea>
          <label for="f-amazon">Link o código de Amazon *</label>
          <input id="f-amazon" required placeholder=https://www.amazon.com/dp/B0XXXXXXX?tag=… o solo el código (ASIN)">
          <label for="f-image">Foto del producto *</label>
          <input id="f-image" type="file" accept="image/*">
          <img id="f-preview" class="preview-img hidden" alt="">
          <p class="status" id="form-status" role="status"></p>
          <div class="actions">
            <button class="btn" type="submit" id="save-btn">Guardar</button>
            <button class="btn ghost hidden" type="button" id="cancel-btn">Cancelar</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Productos de LineOps (<span id="count">0</span>)</h2>
        <p class="status" id="list-status" role="status"></p>
        <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th></th><th>Nombre</th><th>Link</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script>
  (function () {
    'use strict';
    var AFFILIATE_TAG = 'bastidasystem-20';
    var $ = function (id) { return document.getElementById(id); };
    var gate = $('gate'), gateMsg = $('gate-msg'), app = $('app');
    var client = null, editingImageUrl = '';

    function status(el, msg, ok) {
      el.textContent = msg;
      el.className = 'status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Acepta link completo de afiliado, link corto o solo el ASIN (10 caracteres).
    // Si el link no trae tag de afiliado, se le agrega el tuyo.
    function normalizeAmazonUrl(input) {
      var s = String(input || '').trim();
      if (!s) return '';
      if (/^[A-Z0-9]{10}$/i.test(s)) {
        return 'https://www.amazon.com/dp/' + s.toUpperCase() + '?tag=' + AFFILIATE_TAG;
      }
      if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
      var u;
      try { u = new URL(s); } catch (e) { return ''; }
      var host = u.hostname.toLowerCase();
      var isAmazon = /(^|\.)amazon\./.test(host) || /(^|\.)amzn\.to$/.test(host) || host === 'link.amazon';
      if (!isAmazon) return '';
      if (!/[?&]tag=/.test(u.search)) u.searchParams.set('tag', AFFILIATE_TAG);
      return u.toString();
    }

    function slugify(name) {
      return String(name || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || null;
    }

    async function init() {
      if (!window.supabase || !window.BASTIDA_SUPABASE_CONFIG) {
        gateMsg.textContent = 'No se pudo cargar la configuración de Supabase.';
        return;
      }
      client = window.supabase.createClient(
        window.BASTIDA_SUPABASE_CONFIG.url,
        window.BASTIDA_SUPABASE_CONFIG.anonKey
      );
      var sessData = await client.auth.getSession();
      if (!sessData.data || !sessData.data.session) {
        gateMsg.innerHTML = 'Necesitas iniciar sesión. <a href="../login.html">Ir al login</a>';
        return;
      }
      var user = sessData.data.session.user;
      var prof = await client.from('users')
        .select('platform_role, active')
        .eq('auth_user_id', user.id)
        .maybeSingle();
      if (prof.error) {
        gateMsg.textContent = 'No se pudo verificar tu perfil.';
        return;
      }
      var role = prof.data && prof.data.platform_role;
      if (!prof.data || prof.data.active !== true || (role !== 'founder' && role !== 'owner')) {
        gateMsg.textContent = 'Tu cuenta no tiene permiso de administrador.';
        return;
      }
      gate.classList.add('hidden');
      app.classList.remove('hidden');
      bindForm();
      await loadProducts();
    }

    async function loadProducts() {
      var res = await client.from('products')
        .select('*')
        .eq('show_in_market', true)
        .order('created_at', { ascending: false });
      if (res.error) {
        status($('list-status'), 'Error al cargar: ' + res.error.message, false);
        return;
      }
      var data = res.data || [];
      $('count').textContent = data.length;
      var tb = $('rows');
      tb.innerHTML = '';
      data.forEach(function (p) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + (p.image_url ? '<img class="thumb" src="' + esc(p.image_url) + '" alt="">' : '') + '</td>' +
          '<td><strong>' + esc(p.name) + '</strong>' +
            (p.description ? '<br><small style="color:var(--mut)">' + esc(p.description.slice(0, 60)) + '</small>' : '') + '</td>' +
          '<td class="mono">' + esc((p.amazon_url || '').slice(0, 42)) + '…</td>' +
          '<td><span class="pill ' + (p.active ? 'on' : 'off') + '">' +
            (p.active ? 'Visible' : 'Pausado') + '</span></td>' +
          '<td><div class="actions">' +
            '<button class="btn ghost small" data-act="open">Abrir link</button>' +
            '<button class="btn ghost small" data-act="edit">Editar</button>' +
            '<button class="btn ghost small" data-act="toggle">' + (p.active ? 'Pausar' : 'Activar') + '</button>' +
            '<button class="btn danger small" data-act="del">Borrar</button>' +
          '</div></td>';
        tr.querySelector('[data-act="open"]').onclick = function () {
          if (p.amazon_url) window.open(p.amazon_url, '_blank', 'noopener');
        };
        tr.querySelector('[data-act="edit"]').onclick = function () { startEdit(p); };
        tr.querySelector('[data-act="toggle"]').onclick = function () { toggleActive(p); };
        tr.querySelector('[data-act="del"]').onclick = function () { removeProduct(p); };
        tb.appendChild(tr);
      });
      if (!data.length) status($('list-status'), 'Aún no hay productos. Agrega el primero arriba.', true);
      else status($('list-status'), '', null);
    }

    function bindForm() {
      $('f-image').addEventListener('change', function (e) {
        var f = e.target.files[0];
        if (f) { $('f-preview').src = URL.createObjectURL(f); $('f-preview').classList.remove('hidden'); }
      });
      $('cancel-btn').onclick = resetForm;
      $('logout-btn').onclick = async function () {
        await client.auth.signOut();
        location.href = '../login.html';
      };
      $('product-form').addEventListener('submit', onSubmit);
    }

    function resetForm() {
      $('product-form').reset();
      $('f-id').value = '';
      $('f-preview').classList.add('hidden');
      $('cancel-btn').classList.add('hidden');
      $('form-title').textContent = 'Agregar producto a LineOps';
      editingImageUrl = '';
      status($('form-status'), '', null);
    }

    function startEdit(p) {
      $('f-id').value = p.id;
      $('f-name').value = p.name || '';
      $('f-desc').value = p.description || '';
      $('f-amazon').value = p.amazon_url || '';
      editingImageUrl = p.image_url || '';
      if (editingImageUrl) { $('f-preview').src = editingImageUrl; $('f-preview').classList.remove('hidden'); }
      $('form-title').textContent = 'Editar producto de LineOps';
      $('cancel-btn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function toggleActive(p) {
      var res = await client.from('products')
        .update({ active: !p.active }).eq('id', p.id);
      if (res.error) status($('list-status'), 'Error: ' + res.error.message, false);
      else loadProducts();
    }

    async function removeProduct(p) {
      if (!confirm('¿Quitar del Market de LineOps "' + p.name + '"? Esta acción no se puede deshacer.')) return;
      var res = await client.from('products').delete().eq('id', p.id);
      if (res.error) status($('list-status'), 'Error: ' + res.error.message, false);
      else { status($('list-status'), 'Producto borrado.', true); loadProducts(); }
    }

    async function uploadImage(file) {
      var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      var path = 'products/' + crypto.randomUUID() + '.' + ext;
      var up = await client.storage.from('product-images').upload(path, file, {
        contentType: file.type, upsert: false
      });
      if (up.error) throw up.error;
      var pub = client.storage.from('product-images').getPublicUrl(path);
      return pub.data.publicUrl;
    }

    async function onSubmit(e) {
      e.preventDefault();
      var btn = $('save-btn');
      var name = $('f-name').value.trim();
      var desc = $('f-desc').value.trim();
      var amazonUrl = normalizeAmazonUrl($('f-amazon').value);
      var file = $('f-image').files[0];
      var id = $('f-id').value;
      if (!name) { status($('form-status'), 'Ponle un nombre al producto.', false); return; }
      if (!amazonUrl) { status($('form-status'), 'Ese link no parece de Amazon. Pega el link de afiliado o el código (ASIN).', false); return; }
      if (!id && !file && !editingImageUrl) { status($('form-status'), 'Sube una foto del producto.', false); return; }
      btn.disabled = true;
      status($('form-status'), 'Guardando…', null);
      try {
        var imageUrl = editingImageUrl;
        if (file) {
          status($('form-status'), 'Subiendo foto…', null);
          imageUrl = await uploadImage(file);
        }
        if (!imageUrl) { status($('form-status'), 'Sube una foto del producto.', false); btn.disabled = false; return; }
        var row = {
          name: name,
          description: desc,
          price: 0,
          currency: 'USD',
          stripe_link: null,
          amazon_url: amazonUrl,
          slug: slugify(name),
          show_in_store: false,
          show_in_market: true,
          image_url: imageUrl,
          active: true
        };
        var res = id
          ? await client.from('products').update(row).eq('id', id)
          : await client.from('products').insert(row);
        if (res.error) throw res.error;
        status($('form-status'), id ? 'Producto actualizado.' : 'Producto agregado al Market de LineOps.', true);
        resetForm();
        loadProducts();
      } catch (err) {
        status($('form-status'), 'Error: ' + (err.message || err), false);
      } finally {
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
